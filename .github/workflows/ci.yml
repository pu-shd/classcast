name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Build test image
        run: docker build -t umbracast-test .
      - name: Lint, type check and test
        run: docker run --rm umbracast-test
